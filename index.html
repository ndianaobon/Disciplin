<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0C0F16">
<title>Disciplin</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0C0F16; --bg1:#10141E;
    --glass:rgba(255,255,255,.055);
    --glass-border:rgba(255,255,255,.11);
    --text:#E7EAF0; --muted:#8A93A6; --faint:#5A6274;
    --done:#34D399; --late:#F59E0B; --missed:#EF4444; --accent:#1B8F82;
    --r:20px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#05070B;
    color:var(--text);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 48px;
  }
  .lockup{display:flex;align-items:center;gap:9px;margin-bottom:18px}
  .lockup .mark{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 3px 12px rgba(27,114,111,.45))}
  .wordmark{font-size:30px;color:#fff;letter-spacing:.01em}

  /* ---------- phone frame ---------- */
  .phone{
    width:390px;max-width:100%;
    background:linear-gradient(165deg,var(--bg0),var(--bg1) 70%);
    border:1px solid rgba(255,255,255,.09);
    border-radius:44px;
    padding:14px 0 0;
    box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  @media (max-width:430px){
    body{padding:14px 0 0}
    .phone{border-radius:0;border:none;min-height:calc(100vh - 70px)}
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:6px 26px 10px;font-size:13px;font-weight:600;color:var(--muted)}
  .screen{display:none;padding:4px 20px 16px;min-height:700px;flex-direction:column;flex:1}
  .screen.on{display:flex;animation:screenIn .5s var(--ease)}
  @keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- shared ---------- */
  .glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);backdrop-filter:blur(14px)}
  .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

  .rise{opacity:0;transform:translateY(18px);animation:rise .6s var(--ease) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}
  .d5{animation-delay:.33s}.d6{animation-delay:.40s}.d7{animation-delay:.47s}.d8{animation-delay:.54s}.d9{animation-delay:.61s}

  /* ---------- TODAY ---------- */
  .today-head{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 16px}
  .today-head h1{font-size:34px;line-height:1;color:#fff}
  .today-head .date{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:3px}

  .scorecard{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:14px}
  .ring{position:relative;width:92px;height:92px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  #ringArc{transition:stroke-dashoffset 1.4s var(--ease), stroke .6s}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .num b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring .num span{font-size:9px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;font-weight:600}
  .score-meta{flex:1}
  .score-meta .row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--muted)}
  .score-meta .row b{color:var(--text);font-weight:600}
  .trend-down{color:var(--missed)!important}
  .trend-up{color:var(--done)!important}

  .commit{
    width:100%;border:none;cursor:pointer;font-family:'Inter';
    background:linear-gradient(120deg,#1B8F82,#0E5E71);
    color:#fff;font-size:15px;font-weight:700;
    padding:15px;border-radius:16px;margin-bottom:18px;
    box-shadow:0 8px 24px rgba(27,143,130,.28);
    transition:all .25s var(--ease);position:relative;overflow:hidden;
  }
  .commit::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);
    animation:sheen 3.2s ease-in-out infinite;
  }
  @keyframes sheen{0%,55%{left:-60%}85%,100%{left:130%}}
  .commit:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(27,143,130,.4)}
  .commit:active{transform:scale(.98)}
  .commit.done-commit{background:rgba(52,211,153,.1);color:var(--done);box-shadow:none;border:1px solid rgba(52,211,153,.3)}
  .commit.done-commit::after{display:none}

  .tl-label{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
  .tl-label .eyebrow{color:var(--muted)}
  .tl-label span:last-child{font-size:12px;color:var(--faint)}

  .habit{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px;position:relative;transition:all .35s var(--ease)}
  .habit .chip{
    width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    flex:none;background:rgba(255,255,255,.06);color:var(--muted);
    transition:all .35s var(--ease);
  }
  .habit .info{flex:1;min-width:0}
  .habit .info h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .nn{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--accent);border:1px solid rgba(27,143,130,.45);padding:2px 5px;border-radius:5px}
  .habit .info p{font-size:12px;color:var(--muted);margin-top:3px}
  .habit .right{text-align:right;flex:none}
  .habit .time{font-size:12.5px;font-weight:600;color:var(--muted)}
  .state{font-size:11px;font-weight:700;letter-spacing:.06em;margin-top:4px;text-transform:uppercase}

  .habit.done{border-color:rgba(52,211,153,.32)}
  .habit.done .state{color:var(--done)}
  .habit.done .chip{background:rgba(52,211,153,.12);color:var(--done)}

  .habit.late{border-color:rgba(245,158,11,.3)}
  .habit.late .state{color:var(--late)}
  .habit.late .chip{background:rgba(245,158,11,.1);color:var(--late)}

  .habit.missed{opacity:.6;filter:saturate(.5);border-color:rgba(239,68,68,.4)}
  .habit.missed .state{color:var(--missed)}
  .habit.missed .chip{color:var(--missed);background:rgba(239,68,68,.08)}
  .habit.missed::after{
    content:"LOCKED";position:absolute;right:16px;top:10px;
    font-size:8px;letter-spacing:.18em;color:rgba(239,68,68,.55);font-weight:800;
  }
  .habit.missed .time{text-decoration:line-through;color:var(--faint)}

  .habit.open{border-color:rgba(27,143,130,.5);animation:openGlow 2.4s ease-in-out infinite}
  @keyframes openGlow{
    0%,100%{box-shadow:0 0 0 1px rgba(27,143,130,.22), 0 8px 26px rgba(27,143,130,.10)}
    50%{box-shadow:0 0 0 1px rgba(27,143,130,.45), 0 8px 32px rgba(27,143,130,.22)}
  }
  .habit.open .chip{background:rgba(27,143,130,.12);color:var(--accent)}
  .checkbtn{
    border:none;cursor:pointer;font-family:'Inter';
    background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;
    padding:9px 16px;border-radius:11px;white-space:nowrap;
    transition:all .25s var(--ease);
  }
  .checkbtn:hover{background:#1fa192;transform:translateY(-1px);box-shadow:0 6px 16px rgba(27,143,130,.4)}
  .checkbtn:active{transform:scale(.94)}
  .window-note{font-size:10.5px;color:var(--accent);margin-top:4px;font-weight:600;font-variant-numeric:tabular-nums}

  .habit.upcoming .state{color:var(--faint)}

  .gracebtn{
    border:1px solid rgba(52,211,153,.4);background:transparent;color:var(--done);
    cursor:pointer;font-family:'Inter';font-size:10px;font-weight:700;
    padding:5px 9px;border-radius:8px;margin-top:6px;transition:all .2s;
  }
  .gracebtn:hover{background:rgba(52,211,153,.12)}

  .habit.just-done{animation:pop .5s var(--ease)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}

  .review-cta{
    margin-top:auto;margin-bottom:14px;width:100%;cursor:pointer;font-family:'Inter';
    background:rgba(255,255,255,.06);border:1px solid var(--glass-border);
    color:var(--text);font-size:14px;font-weight:600;padding:14px;border-radius:16px;
    transition:all .25s var(--ease);
  }
  .review-cta:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
  .review-cta small{display:block;font-weight:500;color:var(--faint);font-size:11px;margin-top:2px}
  .review-cta.alert{border-color:rgba(239,68,68,.4)}
  .review-cta.alert small{color:var(--missed)}

  .empty-note{text-align:center;color:var(--faint);font-size:13px;padding:30px 10px;line-height:1.6}
  .empty-note button{margin-top:12px}

  .tabbar{display:flex;justify-content:space-around;align-items:center;padding:12px 10px 26px;border-top:1px solid rgba(255,255,255,.07)}
  .tab{font-size:10px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:color .25s;position:relative;background:none;border:none;font-family:'Inter'}
  .tab:hover{color:var(--muted)}
  .tab.cur{color:#fff}
  .tab.cur::before{content:"";position:absolute;top:-13px;width:18px;height:2px;border-radius:2px;background:var(--accent)}
  .tab .ic{width:21px;height:21px}

  .tab-learn-ic{
    width:46px;height:46px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1B8F82,#0E5E71);
    margin-top:-24px;
    box-shadow:0 8px 22px rgba(27,143,130,.45), 0 0 0 5px var(--bg1);
    transition:all .25s var(--ease);
  }
  .tab-learn-ic .ic{width:24px;height:24px;stroke:#fff;stroke-width:2}
  .tab-learn:hover .tab-learn-ic{transform:translateY(-2px)}
  .tab-learn.cur{color:#fff}
  .tab-learn.cur::before{display:none}
  .tab-learn.cur .tab-learn-ic{box-shadow:0 10px 28px rgba(27,143,130,.6), 0 0 0 5px var(--bg1)}

  .lesson-card{cursor:pointer}
  .lesson-card:hover{border-color:rgba(255,255,255,.2)}
  .lesson-list{list-style:none;margin-top:2px}
  .lesson-list li{display:flex;gap:10px;font-size:13px;color:var(--text);line-height:1.55;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .lesson-list li:last-child{border-bottom:none}
  .lesson-list li b{color:var(--accent);flex:none;font-weight:700}

  /* ---------- REPORT CARD ---------- */
  .rc-head{margin:6px 2px 16px;display:flex;justify-content:space-between;align-items:flex-end}
  .rc-head h1{font-size:34px;color:#fff;line-height:1}
  .period-tabs{display:flex;gap:6px}
  .period-tabs button{
    font-family:'Inter';font-size:11px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    padding:6px 12px;border-radius:99px;cursor:pointer;transition:all .25s;
  }
  .period-tabs button.on{color:#fff;background:var(--accent);border-color:var(--accent)}

  .grade-card{padding:26px 22px 22px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
  .grade-card::before{
    content:"";position:absolute;inset:-40% -20% auto;height:150px;
    background:radial-gradient(ellipse at center, rgba(245,158,11,.14), transparent 65%);
    pointer-events:none;
  }
  .grade{font-size:96px;line-height:.9;color:#F5B23C;text-shadow:0 6px 40px rgba(245,158,11,.35);
    display:inline-block;opacity:0;transform:scale(.6);animation:gradeIn .7s .35s var(--ease) forwards}
  @keyframes gradeIn{60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
  .grade sup{font-size:40px;vertical-align:34px}
  .grade-sub{font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:500}
  .grade-sub b{color:var(--text)}
  .verdict{
    margin-top:14px;font-size:13px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    border-radius:12px;padding:10px 14px;line-height:1.5;text-align:left;
  }
  .verdict b{color:var(--missed)}
  .brandstamp{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:var(--faint)}
  .brandstamp .serif{font-size:14px;color:var(--muted)}
  .brandstamp .mini{width:15px;height:15px;object-fit:contain}

  .week-strip{display:flex;justify-content:space-between;padding:16px 18px;margin-bottom:14px}
  .day{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.05em}
  .day .dot{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
    opacity:0;transform:scale(.4);animation:dotIn .45s var(--ease) forwards}
  @keyframes dotIn{to{opacity:1;transform:scale(1)}}
  .day:nth-child(1) .dot{animation-delay:.45s}.day:nth-child(2) .dot{animation-delay:.53s}
  .day:nth-child(3) .dot{animation-delay:.61s}.day:nth-child(4) .dot{animation-delay:.69s}
  .day:nth-child(5) .dot{animation-delay:.77s}.day:nth-child(6) .dot{animation-delay:.85s}
  .day:nth-child(7) .dot{animation-delay:.93s}
  .d-done .dot{background:rgba(52,211,153,.14);color:var(--done);border:1px solid rgba(52,211,153,.35)}
  .d-late .dot{background:rgba(245,158,11,.12);color:var(--late);border:1px solid rgba(245,158,11,.35)}
  .d-miss .dot{background:rgba(239,68,68,.12);color:var(--missed);border:1px solid rgba(239,68,68,.4)}
  .d-off .dot{background:rgba(255,255,255,.04);color:var(--faint);border:1px solid rgba(255,255,255,.08)}
  .d-done{color:var(--muted)} .d-miss{color:var(--missed)}

  .snap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .snap .cell{padding:13px 6px;text-align:center}
  .snap b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .snap span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;display:block;margin-top:4px}
  .snap .bad b{color:var(--missed)}
  .snap .warn b{color:var(--late)}

  .excuse{padding:16px 18px;margin-bottom:14px}
  .excuse h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
  .ex-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .ex-row:last-child{margin-bottom:0}
  .ex-row .bar{height:7px;border-radius:4px;background:linear-gradient(90deg,rgba(239,68,68,.7),rgba(239,68,68,.25));
    width:0;transition:width 1s var(--ease)}
  .ex-row p{font-size:12.5px;color:var(--text);flex:none;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-row span{font-size:11px;color:var(--faint);font-weight:600;flex:none;margin-left:auto}
  .ex-none{font-size:12.5px;color:var(--faint)}

  .share{
    width:100%;border:none;cursor:pointer;font-family:'Inter';
    background:linear-gradient(120deg,#1B8F82,#0E5E71);color:#fff;
    font-size:14.5px;font-weight:700;padding:14px;border-radius:16px;margin-bottom:16px;
    box-shadow:0 8px 24px rgba(27,143,130,.25);transition:all .25s var(--ease);
  }
  .share:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(27,143,130,.38)}
  .share:active{transform:scale(.98)}

  /* ---------- HABITS ---------- */
  .hb-card{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px}
  .hb-card .chip{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.06);color:var(--muted)}
  .hb-card .info{flex:1;min-width:0}
  .hb-card h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .hb-card p{font-size:12px;color:var(--muted);margin-top:3px}
  .editbtn{
    border:1px solid var(--glass-border);background:transparent;color:var(--muted);
    cursor:pointer;font-family:'Inter';font-size:11px;font-weight:700;
    padding:7px 12px;border-radius:9px;transition:all .2s;
  }
  .editbtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .addbtn{
    width:100%;border:1px dashed rgba(255,255,255,.2);background:transparent;cursor:pointer;
    color:var(--muted);font-family:'Inter';font-size:14px;font-weight:600;
    padding:14px;border-radius:16px;margin-top:4px;transition:all .25s;
  }
  .addbtn:hover{color:#fff;border-color:var(--accent);background:rgba(27,143,130,.08)}

  /* ---------- SETTINGS ---------- */
  .set-group{padding:16px 18px;margin-bottom:12px}
  .set-group h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
  .set-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px}
  .set-row p{color:var(--text)}
  .set-row small{display:block;font-size:11px;color:var(--faint);margin-top:2px}
  .toggle{
    width:44px;height:25px;border-radius:99px;background:rgba(255,255,255,.12);border:none;cursor:pointer;
    position:relative;transition:background .25s;flex:none;
  }
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .25s var(--ease)}
  .toggle.on{background:var(--accent)}
  .toggle.on::after{left:22px}
  .lead-chips{display:flex;gap:6px}
  .lead-chips button{
    font-family:'Inter';font-size:11.5px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    padding:6px 11px;border-radius:99px;cursor:pointer;transition:all .2s;
  }
  .lead-chips button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{
    width:26px;height:26px;border-radius:8px;border:1px solid var(--glass-border);background:transparent;
    color:var(--text);font-size:15px;cursor:pointer;font-family:'Inter';
  }
  .stepper b{min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
  .set-actions{display:flex;gap:8px;flex-wrap:wrap}
  .set-actions button{
    flex:1;border:1px solid var(--glass-border);background:rgba(255,255,255,.05);color:var(--text);
    font-family:'Inter';font-size:12px;font-weight:600;padding:10px;border-radius:11px;cursor:pointer;transition:all .2s;
  }
  .set-actions button:hover{border-color:rgba(255,255,255,.25)}
  .set-actions button.danger{color:var(--missed);border-color:rgba(239,68,68,.3)}
  .set-actions button.danger:hover{background:rgba(239,68,68,.08)}
  .notif-status{font-size:11px;color:var(--faint);margin-top:6px}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:18px;
  }
  .overlay.show{display:flex;animation:fadeIn .25s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    width:100%;max-width:350px;max-height:86vh;overflow-y:auto;
    background:linear-gradient(165deg,#131826,#0F131D);
    border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:22px;
    animation:modalIn .35s var(--ease);
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .modal h2{font-size:21px;color:#fff;margin-bottom:4px}
  .modal .sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .field input[type=text],.field input[type=time],.field input[type=number],.field textarea,.field select{

const DAY_LABELS = ['M','T','W','T','F','S','S']; // Monday-first
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- storage ---------- */
function seed(){
  return {
    version:1,
    habits:[
      {id:uid(), name:'Wake up',            icon:'i-sunrise',  time:'05:00', window:30,  grace:15, nn:true,  days:[1,2,3,4,5,6,0]},
      {id:uid(), name:'Gym',                icon:'i-dumbbell', time:'05:30', window:60,  grace:15, nn:true,  days:[1,2,3,4,5,6]},
      {id:uid(), name:'Read 20 pages',      icon:'i-book',     time:'07:30', window:90,  grace:15, nn:false, days:[1,2,3,4,5,6,0]},
      {id:uid(), name:'Deep work · 3 hrs',  icon:'i-focus',    time:'09:00', window:120, grace:20, nn:false, days:[1,2,3,4,5]},
      {id:uid(), name:'Evening walk',       icon:'i-walk',     time:'17:00', window:60,  grace:20, nn:false, days:[1,2,3,4,5,6,0]},
      {id:uid(), name:'Journal + plan tomorrow', icon:'i-pen', time:'21:00', window:90,  grace:20, nn:false, days:[1,2,3,4,5,6,0]},
    ],
    days:{},           // 'YYYY-MM-DD' -> {committedAt, entries:{habitId:{s,at,excuse}}, alerted:{}}
    settings:{ leads:[15,5], notify:false, sound:true, graceWeekly:2 },
  };
}
let db;
try{ db = JSON.parse(localStorage.getItem(STORE)) || seed(); }
catch(e){ db = seed(); }
if(!db.habits) db = seed();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(db)); }catch(e){ /* storage unavailable — keep running in-memory */ } }

/* ---------- date/time helpers ---------- */
const pad = n => String(n).padStart(2,'0');
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return dateStr(new Date()); }
function fromStr(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function minsNow(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function timeToMins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtMins(mins){
  mins = ((mins%1440)+1440)%1440;
  let h=Math.floor(mins/60), m=mins%60;
  const ap = h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  return `${h}:${pad(m)} ${ap}`;
}
function fmtClock(d){ let h=d.getHours(),m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${pad(m)} ${ap}`; }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function weekKey(d){ return dateStr(mondayOf(d)); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- schedule / scoring ---------- */
function scheduledFor(ds){
  const wd = fromStr(ds).getDay();
  return db.habits.filter(h=>h.days.includes(wd)).sort((a,b)=>timeToMins(a.time)-timeToMins(b.time));
}
function dayRec(ds, create){
  if(!db.days[ds] && create) db.days[ds] = {committedAt:null, entries:{}, alerted:{}};
  return db.days[ds] || {committedAt:null, entries:{}, alerted:{}};
}
// status for a habit on a given day. Past days: unresolved = missed.
function statusOf(h, ds){
  const e = dayRec(ds).entries[h.id];
  if(e) return e.s;
  const today = todayStr();
  if(ds < today) return 'missed';
  if(ds > today) return 'upcoming';
  const now = minsNow(), start = timeToMins(h.time), close = closeOf(h);
  if(now < start) return 'upcoming';
  if(now < close) return 'open';
  return 'missed';
}
// windows are capped at midnight — a day's blocks resolve within that day
function closeOf(h){ return Math.min(timeToMins(h.time) + h.window, 1439); }
const CREDIT = {done:1, grace:1, late:0.6, missed:0};
// live=true -> denominator is resolved habits only (today's running score)
function dayResult(ds, live){
  const habits = scheduledFor(ds);
  let pts=0, resolved=0, nnMissed=0, late=0, doneCount=0, penalties=0;
  habits.forEach(h=>{
    const s = statusOf(h, ds);
    if(s==='open'||s==='upcoming') return;
    resolved++;
    pts += CREDIT[s];
    if(s==='late'){ late++; doneCount++; }
    if(s==='done'||s==='grace') doneCount++;
    if(s==='missed' && h.nn){ nnMissed++; penalties += 0.5; }
  });
  const total = live ? resolved : habits.length;
  const score = total===0 ? null : Math.max(0, Math.round((pts - penalties)/total*100));
  return {total:habits.length, resolved, score, nnMissed, late, doneCount, scheduled:habits.length};
}
function gradeOf(pct){
  if(pct==null) return {letter:'—',sup:''};
  const t=[[97,'A','+'],[93,'A',''],[90,'A','−'],[87,'B','+'],[83,'B',''],[80,'B','−'],[77,'C','+'],[73,'C',''],[70,'C','−'],[67,'D','+'],[63,'D',''],[60,'D','−']];
  for(const [min,l,s] of t) if(pct>=min) return {letter:l,sup:s};
  return {letter:'F',sup:''};
}
function periodDays(period){
  // returns array of dateStrs from period start through today
  const today = new Date(); today.setHours(0,0,0,0);
  let start;
  if(period==='week') start = mondayOf(today);
  else if(period==='month') start = new Date(today.getFullYear(), today.getMonth(), 1);
  else start = new Date(today.getFullYear(), 0, 1);
  const out=[];
  for(let d=new Date(start); d<=today; d=addDays(d,1)) out.push(dateStr(d));
  return out;
}
function periodStats(period){
  const days = periodDays(period);
  const today = todayStr();
  const first = firstDataDate();
  let scores=[], nnMissed=0, late=0, done=0, missed=0;
  days.forEach(ds=>{
    if(ds < first) return; // days before tracking began don't count against you
    const r = dayResult(ds, ds===today);
    if(r.scheduled===0) return;
    if(ds===today && r.resolved===0) return;
    if(r.score!=null) scores.push(r.score);
    nnMissed += r.nnMissed;
    late += r.late;
    done += r.doneCount;
    missed += (ds===today ? r.resolved : r.scheduled) - r.doneCount;
  });
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  return {avg, nnMissed, late, done, missed, daysCounted:scores.length};
}
function graceUsedInWeek(d){
  const mon = mondayOf(d);
  let used=0;
  for(let i=0;i<7;i++){
    const ds = dateStr(addDays(mon,i));
    const rec = db.days[ds];
    if(rec) Object.values(rec.entries).forEach(e=>{ if(e.s==='grace') used++; });
  }
  return used;
}
function graceLeft(){ return Math.max(0, db.settings.graceWeekly - graceUsedInWeek(new Date())); }
function streak(){
  let s=0;
  let d = addDays(new Date(),-1);
  for(let i=0;i<730;i++){
    const ds = dateStr(d);
    const r = dayResult(ds,false);
    if(r.scheduled>0){
      if(r.score>=70) s++; else break;
    }
    d = addDays(d,-1);
    if(ds <= firstDataDate()) break;
  }
  const t = dayResult(todayStr(), true);
  if(t.scheduled>0 && t.resolved===t.scheduled && t.score>=70) s++;
  return s;
}
function firstDataDate(){
  const keys = Object.keys(db.days).sort();
  return keys[0] || todayStr();
}
function trend30(){
  const today = new Date();
  const avgRange = (from,to)=>{ // days ago, inclusive
    let sc=[];
    for(let i=from;i<=to;i++){
      const ds = dateStr(addDays(today,-i));
      if(ds < firstDataDate()) break;
      const r = dayResult(ds,false);
      if(r.scheduled>0 && r.score!=null) sc.push(r.score);
    }
    return sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null;
  };
  const recent = avgRange(1,30), prior = avgRange(31,60);
  if(recent==null || prior==null) return null;
  return Math.round(recent-prior);
}

/* ---------- auto-miss + alerts (the 15/5-minute round-up nudge) ---------- */
let audioCtx;
function beep(){
  if(!db.settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    [[880,0],[660,.18]].forEach(([f,off])=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=f; o.type='sine';
      g.gain.setValueAtTime(.12,t+off); g.gain.exponentialRampToValueAtTime(.001,t+off+.25);
      o.connect(g); g.connect(audioCtx.destination); o.start(t+off); o.stop(t+off+.3);
    });
  }catch(e){}
}
function notify(title, body, warn){
  showToast(`${title} — ${body}`, warn);
  beep();
  if(db.settings.notify && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title,{body, icon:'logo.png', tag:'disciplin-'+title}); }catch(e){}
  }
}
function tick(){
  const ds = todayStr();
  const now = minsNow();
  const rec = dayRec(ds, true);
  if(!rec.alerted) rec.alerted = {}; // imported/legacy records may lack it
  let changed=false;
  scheduledFor(ds).forEach(h=>{
    const start = timeToMins(h.time), close = closeOf(h);
    const e = rec.entries[h.id];
    // auto-lock misses — only announce fresh ones, not blocks long past when the app opens
    if(!e && now >= close){
      rec.entries[h.id] = {s:'missed', at:Date.now(), excuse:''};
      changed = true;
      if(now - close <= 15) notify(h.name, `Window closed at ${fmtMins(close)} — marked missed.`, true);
      return;
    }
    if(e) return;
    // pre-block alerts at each configured lead (15 / 5 min): round up what you're doing
    db.settings.leads.forEach(lead=>{
      const key = `${h.id}:${lead}`;
      if(!rec.alerted[key] && now >= start-lead && now < start){
        rec.alerted[key]=true; changed=true;
        notify(h.name, `Starts in ${start-now} minute${start-now===1?'':'s'} — round up what you're doing.`);
      }
    });
    const okey = `${h.id}:open`;
    if(!rec.alerted[okey] && now >= start && now < Math.min(close, start+3)){
      rec.alerted[okey]=true; changed=true;
      notify(h.name, `Window is open — check in before ${fmtMins(close)}.`);
    }
  });
  if(changed){ save(); if(curScreen==='scr-today') renderToday(); }
}

let ringAnimated = false;
function renderToday(){

      return `<div class="glass habit late"><div class="chip"><svg class="ic"><use href="#${h.icon}"/></svg></div>
        <div class="info"><h3>${esc(h.name)}${nn}</h3><p>Checked in ${e&&e.at?fmtClock(new Date(e.at)):''}${lateBy?` · ${lateBy} min late`:''}</p></div>
        <div class="right"><div class="time">${fmtMins(start)}</div><div class="state">Late ×0.6</div></div></div>`;

    if(s==='missed'){

        <div class="right"><div class="time">${fmtMins(start)}</div><div class="state">Missed${h.nn?' −0.5':''}</div>${graceBtn}</div></div>`;
    }
    if(s==='open'){
      const remain = close-now;

        <div class="info"><h3>${esc(h.name)}${nn}</h3><p>Window open · closes ${fmtMins(close)}</p>

    }

    const inMins = start-now;

    return `<div class="glass habit upcoming"><div class="chip"><svg class="ic"><use href="#${h.icon}"/></svg></div>
      <div class="info"><h3>${esc(h.name)}${nn}</h3><p>Opens ${fmtMins(start)}</p></div>

  // reflection needed?

    const e = rec.entries[h.id];

  });
  const nnRefl = needRefl.filter(h=>h.nn).length;

  const committed = rec.committedAt;
  const commitHtml = habits.length===0 ? '' :
    committed
      ? `<button class="commit done-commit" disabled>Committed — ${fmtClock(new Date(committed))}</button>`

  const reflHtml = needRefl.length===0 ? '' :
    `<button class="review-cta ${nnRefl?'alert':''}" id="reflBtn">Complete today's check-in
      <small>${needRefl.length} reflection${needRefl.length>1?'s':''} required${nnRefl?' — you missed a non-negotiable':''}</small>
    </button>`;

  const listHtml = habits.length===0
    ? `<div class="empty-note">No blocks scheduled today.<br>Build your routine in the Habits tab.<br>
        <button class="checkbtn" id="goHabits">Add your first habit</button></div>`
    : cards;

  $('#scr-today').innerHTML = `
    <div class="today-head rise d1">
      <div>
        <div class="eyebrow">${dateLabel}</div>
        <h1 class="serif">Today</h1>
      </div>
      <div class="date">${r.doneCount} of ${habits.length} blocks done</div>
    </div>
    <div class="glass scorecard rise d2">
      <div class="ring">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="8"/>
          <circle id="ringArc" cx="46" cy="46" r="40" fill="none" stroke="#F59E0B" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
        </svg>
        <div class="num"><b id="scoreNum">${liveScore==null?'—':'0'}</b><span>Score</span></div>
      </div>
      <div class="score-meta">
        <div class="row"><span>30-day trend</span>${trendHtml}</div>
        <div class="row"><span>Current streak</span><b>${st} day${st===1?'':'s'}</b></div>
        <div class="row"><span>Grace tokens</span><b>${gl} of ${db.settings.graceWeekly} left</b></div>
      </div>
    </div>
    ${commitHtml}
    <div class="tl-label rise d4">
      <span class="eyebrow">Schedule</span>
      <span>No backfilling · windows enforced</span>
    </div>

  `;

  // ring animation
  if(liveScore!=null){
    const color = liveScore>=85 ? '#34D399' : liveScore>=60 ? '#F59E0B' : '#EF4444';
    $('#ringArc').setAttribute('stroke', color);
    animateScore(liveScore, ringAnimated?600:1400);
    ringAnimated = true;
  }

  // wire events
  const cb = $('#commitBtn');
  if(cb) cb.addEventListener('click', ()=>{
    dayRec(ds,true).committedAt = Date.now(); save();
    renderToday();
    showToast('Committed. No backfilling — windows are enforced.');
  });
  $$('#scr-today [data-check]').forEach(b=>b.addEventListener('click', ()=>checkIn(b.dataset.check)));
  $$('#scr-today [data-grace]').forEach(b=>b.addEventListener('click', ()=>useGrace(b.dataset.grace)));
  const rb = $('#reflBtn'); if(rb) rb.addEventListener('click', openReflection);
  const gh = $('#goHabits'); if(gh) gh.addEventListener('click', ()=>$$('.tab')[2].click());

function animateScore(to, dur){
  const num = $('#scoreNum'), arc = $('#ringArc');
  if(!num||!arc) return;
  const set = v=>{ num.textContent=v; arc.setAttribute('stroke-dashoffset', 251.3*(1-v/100)); };
  if(reduceMotion || document.hidden){ set(to); return; } // rAF is frozen in background tabs
  const from = parseInt(num.textContent)||0, t0=performance.now();
  (function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    set(Math.round(from+(to-from)*e));
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

function checkIn(id){
  const h = db.habits.find(x=>x.id===id); if(!h) return;
  const ds = todayStr(), now = minsNow(), start = timeToMins(h.time);
  const rec = dayRec(ds,true);
  if(rec.entries[id]) return;
  const s = (now-start) <= h.grace ? 'done' : 'late';
  rec.entries[id] = {s, at:Date.now(), excuse:''};
  save();
  renderToday();
  showToast(`${h.name} — checked in at ${fmtClock(new Date())}${s==='late'?' (late ×0.6)':''}`, s==='late');
}
function useGrace(id){
  const h = db.habits.find(x=>x.id===id); if(!h) return;
  if(graceLeft()<=0){ showToast('No grace tokens left this week', true); return; }
  const rec = dayRec(todayStr(),true);
  rec.entries[id] = {s:'grace', at:Date.now(), excuse:(rec.entries[id]||{}).excuse||''};
  save(); renderToday();
  showToast(`Grace token spent on ${h.name} — ${graceLeft()} left this week`);
}

  openModal(`
    <h2 class="serif">Reflection</h2>

    ${items.map(h=>`
      <div class="refl-item" data-item="${h.id}">
        <h3>✕ ${esc(h.name)}${h.nn?' <span class="nn">NN</span>':''}</h3>
        <div class="excuse-chips">${chips(h)}</div>
        <div class="field"><input type="text" placeholder="Or type your own…" data-custom="${h.id}"></div>
      </div>`).join('')}
    <div class="modal-actions">
      <button class="btn-ghost" id="reflCancel">Later</button>
      <button class="btn-primary" id="reflSave">Save reflection</button>
    </div>
  `);
  const chosen = {};
  $$('#modal [data-ex]').forEach(b=>b.addEventListener('click', ()=>{
    $$(`#modal [data-h="${b.dataset.h}"]`).forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    chosen[b.dataset.h] = b.dataset.ex;
    const inp = $(`#modal [data-custom="${b.dataset.h}"]`); if(inp) inp.value='';
  }));
  $('#reflCancel').addEventListener('click', closeModal);
  $('#reflSave').addEventListener('click', ()=>{
    let saved = 0;
    items.forEach(h=>{
      const custom = ($(`#modal [data-custom="${h.id}"]`).value||'').trim();
      const ex = custom || chosen[h.id];
      if(ex){ rec.entries[h.id].excuse = ex; saved++; }

    if(saved===0){ showToast('Pick or type a reason for at least one miss', true); return; }
    save(); closeModal(); renderToday();
    showToast('Reflection saved. It shows up on your report card.');
  });
}

let period = 'week';
function renderReport(){
  const stats = periodStats(period);
  const g = gradeOf(stats.avg);
  const today = new Date();
  const mon = mondayOf(today);
  const periodLabel = period==='week'
    ? `Week of ${mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${addDays(mon,6).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`
    : period==='month' ? today.toLocaleDateString('en-US',{month:'long',year:'numeric'})
    : String(today.getFullYear());

  // week strip (always current week)
  const tds = todayStr();
  const first = firstDataDate();
  const stripDays = [];
  for(let i=0;i<7;i++){
    const d = addDays(mon,i), ds = dateStr(d);
    const lbl = d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    if(ds > tds || ds < first){ stripDays.push({lbl, cls:'d-off', sym:'·'}); continue; }
    const r = dayResult(ds, ds===tds);
    if(r.scheduled===0){ stripDays.push({lbl, cls:'d-off', sym:'R'}); continue; }
    if(ds===tds && r.resolved===0){ stripDays.push({lbl, cls:'d-off', sym:'·'}); continue; }
    if(r.nnMissed>0 || r.score<60) stripDays.push({lbl, cls:'d-miss', sym:'✕'});
    else if(r.score>=80) stripDays.push({lbl, cls:'d-done', sym:'✓'});
    else stripDays.push({lbl, cls:'d-late', sym:'~'});
  }

  // verdict from data
  let verdict;
  if(stats.daysCounted===0){
    verdict = 'No data yet this ' + period + '. Show up, check in, and your verdict gets written here.';
  } else {
    const missCount = {};
    periodDays(period).forEach(ds=>{
      if(ds < first) return;
      scheduledFor(ds).forEach(h=>{
        if(ds===tds && !dayRec(ds).entries[h.id]) return;
        if(statusOf(h,ds)==='missed') missCount[h.name]=(missCount[h.name]||0)+1;
      });
    });
    const worst = Object.entries(missCount).sort((a,b)=>b[1]-a[1])[0];
    if(worst){
      const exc = topExcuses(period)[0];
      verdict = `You missed <b>${esc(worst[0])} ${worst[1]===1?'once':worst[1]===2?'twice':worst[1]+' times'}</b>` +
        (exc ? ` — top reason logged: “${esc(exc[0])}”. Fix the cause, not the calendar.` : `. The pattern is the problem, not the day.`);
    } else {
      verdict = `Zero misses this ${period}. ${stats.late>0?`Tighten up the ${stats.late} late check-in${stats.late>1?'s':''} and this becomes an A.`:'Clean sheet — keep the standard.'}`;
    }
  }

  const excuses = topExcuses(period);
  const maxEx = excuses.length ? excuses[0][1] : 1;
  const exHtml = excuses.length===0
    ? `<p class="ex-none">No excuses logged this ${period}. Either you're clean or you're not reflecting.</p>`
    : excuses.slice(0,4).map(([txt,n])=>
        `<div class="ex-row"><p>“${esc(txt)}”</p><div class="bar" data-w="${Math.round(30+ (n/maxEx)*120)}"></div><span>×${n}</span></div>`).join('');

  const gradeColor = stats.avg==null?'#8A93A6':stats.avg>=90?'#34D399':stats.avg>=75?'#F5B23C':'#EF4444';

  $('#scr-report').innerHTML = `
    <div class="rc-head rise d1">
      <div>
        <div class="eyebrow">${periodLabel}</div>
        <h1 class="serif">Report Card</h1>
      </div>
      <div class="period-tabs">
        <button data-p="week"  class="${period==='week'?'on':''}">W</button>
        <button data-p="month" class="${period==='month'?'on':''}">M</button>
        <button data-p="year"  class="${period==='year'?'on':''}">Y</button>
      </div>
    </div>
    <div class="glass grade-card rise d2">
      <div class="grade serif" style="color:${gradeColor};text-shadow:0 6px 40px ${gradeColor}55">${g.letter}${g.sup?`<sup>${g.sup}</sup>`:''}</div>
      <div class="grade-sub">${stats.avg==null?'No scored days yet':`${period[0].toUpperCase()+period.slice(1)} average <b>${stats.avg}%</b> · ${stats.daysCounted} day${stats.daysCounted===1?'':'s'} scored`}</div>
      <div class="verdict">${verdict}</div>
      <div class="brandstamp"><img class="mini" src="logo.png" alt=""><span class="serif">Disciplin</span><span>· ${periodLabel}</span></div>
    </div>
    <div class="glass week-strip rise d3">
      ${stripDays.map(d=>`<div class="day ${d.cls}">${d.lbl}<div class="dot">${d.sym}</div></div>`).join('')}
    </div>
    <div class="snap rise d4">
      <div class="glass cell"><b>${stats.avg==null?'—':stats.avg+'%'}</b><span>${period} avg</span></div>
      <div class="glass cell ${stats.nnMissed>0?'bad':''}"><b>${stats.nnMissed}</b><span>NN missed</span></div>
      <div class="glass cell ${stats.late>0?'warn':''}"><b>${stats.late}</b><span>Late</span></div>
      <div class="glass cell"><b>${graceLeft()}</b><span>Grace left</span></div>
    </div>
    <div class="glass excuse rise d5">
      <h4>Your excuses this ${period}</h4>
      ${exHtml}
    </div>
    <button class="share rise d6" id="shareBtn">Share report card</button>
  `;

  setTimeout(()=>$$('#scr-report .bar').forEach(b=>b.style.width=b.dataset.w+'px'), 500);
  $$('#scr-report .period-tabs button').forEach(b=>b.addEventListener('click',()=>{ period=b.dataset.p; renderReport(); }));
  $('#shareBtn').addEventListener('click', shareReport);
}
function topExcuses(p){
  const counts = {};
  periodDays(p).forEach(ds=>{
    const rec = db.days[ds]; if(!rec) return;
    Object.values(rec.entries).forEach(e=>{ if(e.excuse) counts[e.excuse]=(counts[e.excuse]||0)+1; });
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
async function shareReport(){
  const stats = periodStats(period);
  const g = gradeOf(stats.avg);
  const text =
`Disciplin — ${period} report card
Grade: ${g.letter}${g.sup} (${stats.avg==null?'no data':stats.avg+'%'})
✓ ${stats.done} done · ~ ${stats.late} late · ✕ ${stats.missed} missed (${stats.nnMissed} non-negotiable)
Streak: ${streak()} days
Discipline is a score. Track yours.`;
  if(navigator.share){
    try{ await navigator.share({title:'Disciplin report card', text}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(text); showToast('Report card copied to clipboard'); }
  catch(e){ showToast('Could not copy — select and share manually', true); }
}

      : [1,2,3,4,5,6,0].filter(d=>h.days.includes(d)).map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(' · ');
    return `<div class="glass hb-card">
      <div class="chip"><svg class="ic"><use href="#${h.icon}"/></svg></div>
      <div class="info"><h3>${esc(h.name)}${h.nn?' <span class="nn">NN</span>':''}</h3>
        <p>${fmtMins(timeToMins(h.time))} · ${h.window} min window · ${daysTxt}</p></div>
      <button class="editbtn" data-edit="${h.id}">Edit</button>
    </div>`;
  }).join('');
  $('#scr-habits').innerHTML = `
    <div class="rc-head rise d1">
      <div>
        <div class="eyebrow">${db.habits.length} block${db.habits.length===1?'':'s'} · your standard</div>
        <h1 class="serif">Habits</h1>
      </div>
    </div>
    ${rows || '<div class="empty-note">Nothing here yet.<br>Your routine starts with one block.</div>'}
    <button class="addbtn" id="addHabit">+ New habit block</button>
  `;
  $('#addHabit').addEventListener('click', ()=>openHabitForm(null));
  $$('#scr-habits [data-edit]').forEach(b=>b.addEventListener('click', ()=>openHabitForm(b.dataset.edit)));
}

function openHabitForm(id){
  const h = id ? db.habits.find(x=>x.id===id) : {name:'', icon:'i-focus', time:'06:00', window:60, grace:15, nn:false, days:[1,2,3,4,5,6,0]};
  const sel = new Set(h.days);
  let icon = h.icon;
  openModal(`
    <h2 class="serif">${id?'Edit habit':'New habit'}</h2>
    <p class="sub">${id?'Change the standard — history stays.':'Define the block. The window is the contract.'}</p>
    <div class="field"><label>Name</label><input type="text" id="hf-name" value="${esc(h.name)}" placeholder="e.g. Gym" maxlength="40"></div>
    <div class="field-row">
      <div class="field"><label>Start time</label><input type="time" id="hf-time" value="${h.time}"></div>
      <div class="field"><label>Window (min)</label><input type="number" id="hf-window" value="${h.window}" min="5" max="720"></div>
    </div>
    <div class="field"><label>On-time grace (min) — check in later than this and it counts Late ×0.6</label>
      <input type="number" id="hf-grace" value="${h.grace}" min="0" max="120"></div>
    <div class="field"><label>Days</label>
      <div class="daypick" id="hf-days">${[1,2,3,4,5,6,0].map((d,i)=>`<button data-d="${d}" class="${sel.has(d)?'on':''}">${DAY_LABELS[i]}</button>`).join('')}</div></div>
    <div class="field"><label>Icon</label>
      <div class="iconpick" id="hf-icons">${ICONS.map(ic=>`<button data-ic="${ic}" class="${ic===icon?'on':''}"><svg class="ic"><use href="#${ic}"/></svg></button>`).join('')}</div></div>
    <div class="nn-row"><div><p>Non-negotiable</p><small>Missing it costs an extra −0.5 and demands a reflection</small></div>
      <button class="toggle ${h.nn?'on':''}" id="hf-nn"></button></div>
    <div class="modal-actions">
      ${id?'<button class="btn-danger" id="hf-delete">Delete</button>':''}
      <button class="btn-ghost" id="hf-cancel">Cancel</button>
      <button class="btn-primary" id="hf-save">Save</button>
    </div>
  `);
  $$('#hf-days button').forEach(b=>b.addEventListener('click',()=>{
    const d=+b.dataset.d;
    if(sel.has(d)){sel.delete(d);b.classList.remove('on');} else {sel.add(d);b.classList.add('on');}
  }));
  $$('#hf-icons button').forEach(b=>b.addEventListener('click',()=>{
    $$('#hf-icons button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); icon=b.dataset.ic;
  }));
  $('#hf-nn').addEventListener('click', e=>e.currentTarget.classList.toggle('on'));
  $('#hf-cancel').addEventListener('click', closeModal);
  if(id) $('#hf-delete').addEventListener('click', ()=>{
    openModal(`
      <h2 class="serif">Delete “${esc(h.name)}”?</h2>
      <p class="sub">The block is removed from your schedule. Past check-ins stay in history.</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="del-no">Keep it</button>
        <button class="btn-danger" id="del-yes">Delete</button>
      </div>`);
    $('#del-no').addEventListener('click', ()=>openHabitForm(id));
    $('#del-yes').addEventListener('click', ()=>{
      db.habits = db.habits.filter(x=>x.id!==id);
      save(); closeModal(); renderHabits();
      showToast(`${h.name} deleted`);
    });
  });
  $('#hf-save').addEventListener('click', ()=>{
    const name = $('#hf-name').value.trim();
    const time = $('#hf-time').value;
    const windowM = Math.max(5, Math.min(720, parseInt($('#hf-window').value)||60));
    const grace = Math.max(0, Math.min(120, parseInt($('#hf-grace').value)||0));
    const nn = $('#hf-nn').classList.contains('on');
    if(!name){ showToast('Give it a name', true); return; }
    if(!time){ showToast('Pick a start time', true); return; }
    if(sel.size===0){ showToast('Pick at least one day', true); return; }
    const data = {name, time, window:windowM, grace, nn, days:[...sel], icon};
    if(id) Object.assign(db.habits.find(x=>x.id===id), data);
    else db.habits.push({id:uid(), ...data});
    save(); closeModal(); renderHabits();
    if(curScreen==='scr-today') renderToday();
    showToast(id?'Habit updated':'Habit added to your routine');
  });
}

/* =====================================================
   SETTINGS
   ===================================================== */
function renderSettings(){
  const s = db.settings;
  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  const notifStatus =
    perm==='unsupported' ? 'This browser does not support notifications.' :
    perm==='denied' ? 'Blocked by the browser — enable notifications for this site in browser settings.' :
    perm==='granted' && s.notify ? 'Active — you will be nudged before every block while this page is open.' :
    'Off — enable to get pre-block alerts.';
  $('#scr-settings').innerHTML = `
    <div class="rc-head rise d1">
      <div>
        <div class="eyebrow">Your rules, enforced</div>
        <h1 class="serif">Settings</h1>
      </div>
    </div>
    <div class="glass set-group rise d2">
      <h4>Alerts</h4>
      <div class="set-row"><div><p>Browser notifications</p><small>Nudges you before each block starts</small></div>
        <button class="toggle ${s.notify&&perm==='granted'?'on':''}" id="st-notify"></button></div>
      <div class="notif-status">${notifStatus}</div>
      <div class="set-row" style="margin-top:8px"><div><p>Alert lead times</p><small>Minutes before a block to warn you</small></div>
        <div class="lead-chips" id="st-leads">
          ${[15,10,5].map(l=>`<button data-l="${l}" class="${s.leads.includes(l)?'on':''}">${l}m</button>`).join('')}
        </div></div>
      <div class="set-row"><div><p>Alert sound</p><small>Short chime with each alert</small></div>
        <button class="toggle ${s.sound?'on':''}" id="st-sound"></button></div>
    </div>
    <div class="glass set-group rise d3">
      <h4>Discipline rules</h4>
      <div class="set-row"><div><p>Grace tokens per week</p><small>Convert a miss into a pass — scarcity is the point</small></div>
        <div class="stepper"><button id="gr-minus">−</button><b id="gr-num">${s.graceWeekly}</b><button id="gr-plus">+</button></div></div>
    </div>
    <div class="glass set-group rise d4">
      <h4>Data</h4>
      <div class="set-actions">
        <button id="st-export">Export JSON</button>
        <button id="st-import">Import</button>
        <button class="danger" id="st-reset">Reset all data</button>
      </div>
      <div class="notif-status">Everything is stored locally in this browser. Export regularly if you care about it.</div>
    </div>
    <div class="glass set-group rise d5">
      <h4>About</h4>
      <div class="set-row"><p style="color:var(--muted);font-size:12.5px;line-height:1.6">
        Disciplin scores your day: Done = 1 · Late = ×0.6 · Missed = 0 (non-negotiables cost an extra −0.5).
        Windows are enforced, no backfilling. Keep this tab open to receive pre-block alerts.
      </p></div>
    </div>
  `;
  $('#st-notify').addEventListener('click', async e=>{
    const t = e.currentTarget;
    if(!('Notification' in window)){ showToast('Notifications not supported here', true); return; }
    if(!db.settings.notify || Notification.permission!=='granted'){
      const p = await Notification.requestPermission();
      if(p==='granted'){
        db.settings.notify = true; save(); t.classList.add('on');
        notify('Disciplin','Alerts are on. You will hear from me before every block.');
        renderSettings();
      } else { showToast('Permission not granted', true); renderSettings(); }
    } else {
      db.settings.notify = false; save(); t.classList.remove('on'); renderSettings();
    }
  });
  $$('#st-leads button').forEach(b=>b.addEventListener('click', ()=>{
    const l=+b.dataset.l, arr=db.settings.leads;
    if(arr.includes(l)){ db.settings.leads = arr.filter(x=>x!==l); b.classList.remove('on'); }
    else { arr.push(l); arr.sort((a,b2)=>b2-a); b.classList.add('on'); }
    save();
  }));
  $('#st-sound').addEventListener('click', e=>{
    db.settings.sound = !db.settings.sound; save();
    e.currentTarget.classList.toggle('on');
    if(db.settings.sound) beep();
  });
  $('#gr-minus').addEventListener('click', ()=>{ db.settings.graceWeekly=Math.max(0,db.settings.graceWeekly-1); save(); $('#gr-num').textContent=db.settings.graceWeekly; });
  $('#gr-plus').addEventListener('click', ()=>{ db.settings.graceWeekly=Math.min(7,db.settings.graceWeekly+1); save(); $('#gr-num').textContent=db.settings.graceWeekly; });
  $('#st-export').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `disciplin-backup-${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    showToast('Backup downloaded');
  });
  $('#st-import').addEventListener('click', ()=>$('#importFile').click());
  $('#st-reset').addEventListener('click', ()=>{
    openModal(`
      <h2 class="serif">Reset everything?</h2>
      <p class="sub">All habits, history, and scores in this browser will be wiped. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="rs-no">Cancel</button>
        <button class="btn-danger" id="rs-yes">Wipe it all</button>
      </div>`);
    $('#rs-no').addEventListener('click', closeModal);
    $('#rs-yes').addEventListener('click', ()=>{
      localStorage.removeItem(STORE);
      db = seed(); save();
      closeModal(); renderSettings();
      showToast('Fresh start. Default routine restored.');
    });
  });
}
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.habits || !data.settings) throw new Error('bad shape');
      db = data; save();
      RENDER[curScreen]();
      showToast('Backup imported');
    }catch(err){ showToast('Invalid backup file', true); }
  };
  reader.readAsText(f);
  e.target.value='';
});

/* ---------- clock + countdown updater ---------- */
function updateClock(){
  const n = new Date();
  $('#clock').textContent = fmtClock(n);
  $('#dateShort').textContent = n.toLocaleDateString('en-US',{month:'short', day:'numeric'});
  // live countdown on open habit windows
  $$('#scr-today .window-note[data-close]').forEach(el=>{
    const closeM = +el.dataset.close;
    const remainS = closeM*60 - (n.getHours()*3600+n.getMinutes()*60+n.getSeconds());
    if(remainS<=0){ tick(); return; }
    el.textContent = `${pad(Math.floor(remainS/60))}:${pad(remainS%60)} remaining`;
  });
}

/* ---------- day rollover ---------- */
let lastDay = todayStr();
setInterval(()=>{
  if(todayStr()!==lastDay){
    lastDay = todayStr();
    ringAnimated = false;
    RENDER[curScreen]();
  }
}, 30000);

/* ---------- refresh when tab returns to foreground ---------- */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ tick(); RENDER[curScreen](); }
});

/* ---------- boot ---------- */
save();
renderToday();
updateClock();
tick();
setInterval(updateClock, 1000);
setInterval(tick, 20000);
</script>
</body>
